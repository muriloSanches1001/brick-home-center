name: ci

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --if-present

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [ typecheck ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [ typecheck, lint ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: 'npm'
      - run: npm ci
      - run: npm run test --if-present

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
